name: CI

# Runs the linter and the Pester tests on every pull request and every push to
# main. The tests need no lab and no Configuration Manager.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install PSScriptAnalyzer 1.25.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Analyze
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lib = Join-Path $PWD 'Lib'
          $files = Get-ChildItem -Recurse -File -Include *.ps1, *.psm1, *.psd1 | Where-Object { -not $_.FullName.StartsWith($lib, [System.StringComparison]::OrdinalIgnoreCase) }
          $findings = foreach ($file in $files) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try { Invoke-ScriptAnalyzer -Path $file.FullName -Settings (Join-Path $PWD 'PSScriptAnalyzerSettings.psd1') -ErrorAction Stop; break }
              catch { if ($attempt -eq 3) { throw } }
            }
          }
          $findings | Format-Table Severity, RuleName, ScriptName, Line, Message -AutoSize | Out-String -Width 200 | Write-Host
          Write-Host ('PSScriptAnalyzer findings: {0}' -f @($findings).Count)
          if (@($findings).Count -gt 0) { throw 'PSScriptAnalyzer reported findings' }

  test-powershell:
    name: Pester (Windows PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SUITE_ALLOW_WINDOW_TESTS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Pester 5.7.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1 -ErrorAction Stop

      - name: Run the tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -RequiredVersion 5.7.1 -ErrorAction Stop
          $config = New-PesterConfiguration
          $config.Run.Path = 'Tests'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Normal'
          $result = Invoke-Pester -Configuration $config
          Write-Host ("host {0}: total {1}, passed {2}, failed {3}" -f $PSVersionTable.PSVersion, $result.TotalCount, $result.PassedCount, $result.FailedCount)
          if ($result.TotalCount -eq 0) { throw 'Pester found no tests' }
          if ($result.Result -ne 'Passed' -or $result.FailedCount -gt 0 -or $result.FailedBlocksCount -gt 0 -or $result.FailedContainersCount -gt 0) { throw 'Pester reported failures' }

  test-pwsh:
    name: Pester (PowerShell 7)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SUITE_ALLOW_WINDOW_TESTS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Pester 5.7.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1 -ErrorAction Stop

      - name: Run the tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -RequiredVersion 5.7.1 -ErrorAction Stop
          $config = New-PesterConfiguration
          $config.Run.Path = 'Tests'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Normal'
          $result = Invoke-Pester -Configuration $config
          Write-Host ("host {0}: total {1}, passed {2}, failed {3}" -f $PSVersionTable.PSVersion, $result.TotalCount, $result.PassedCount, $result.FailedCount)
          if ($result.TotalCount -eq 0) { throw 'Pester found no tests' }
          if ($result.Result -ne 'Passed' -or $result.FailedCount -gt 0 -or $result.FailedBlocksCount -gt 0 -or $result.FailedContainersCount -gt 0) { throw 'Pester reported failures' }